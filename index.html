<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossing the Ocean Frank</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- Main Game HUD -->
        <div id="ui-top">
            <div id="score">000</div>
        </div>
        
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="480" height="520"></canvas>
            
            <!-- MINIMALIST WHITE MENU -->
            <div id="menu-overlay">
                <div class="menu-content">
                    <h1 class="blond-font-title">crossing the ocean</h1>
                    <h2 class="blond-font-subtitle">frank</h2>
                    
                    <button id="start-btn">INICIAR JOGO</button>
                    
                    <div class="instructions">
                        <p>USE AS SETAS PARA MOVER</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="ui-bottom">
            <div id="lives"></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
